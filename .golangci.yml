# golangci-lint v2 configuration.
# https://golangci-lint.run/docs/configuration/file/

version: "2"

run:
  timeout: 5m
  modules-download-mode: readonly

linters:
  enable:
    - errcheck
    - errname
    - govet
    - ineffassign
    - prealloc
    - predeclared
    - revive
    - staticcheck
    - unused

  settings:
    revive:
      rules:
        - name: error-naming
        - name: error-return
        - name: error-strings
        - name: errorf
        - name: exported
        - name: increment-decrement
        - name: indent-error-flow
        - name: range
        - name: receiver-naming
        - name: superfluous-else
        - name: time-naming
        - name: unused-parameter
        - name: var-naming

  exclusions:
    presets:
      - comments
      - std-error-handling

formatters:
  enable:
    - gofmt
    - goimports

issues:
  max-issues-per-linter: 0
  max-same-issues: 0
  uniq-by-line: false
